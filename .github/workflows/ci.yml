name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: make test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-sorter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: email-sorter/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
