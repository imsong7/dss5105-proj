{% macro mailbox_fields() %}
<label for="provider">Mail source</label>
<select id="provider">
  <option value="outlook">Outlook (Graph token)</option>
  <option value="imap">Gmail or other (IMAP)</option>
</select>

<div id="f-outlook">
  <label for="token">Graph access token</label>
  <textarea id="token" spellcheck="false" autocomplete="off" placeholder="Paste the token from Graph Explorer"></textarea>
</div>
<div id="f-imap" hidden>
  <label for="host">IMAP server</label>
  <input id="host" placeholder="imap.gmail.com" autocomplete="off">
  <label for="user">Email address</label>
  <input id="user" autocomplete="off">
  <label for="pass">App password</label>
  <input id="pass" type="password" autocomplete="off">
</div>

<label for="count">How many recent emails</label>
<input id="count" type="number" min="1" value="10">
{% endmacro %}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Inbox sorter{% endblock %}</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="layout">
<aside>
  <div>
    <div class="brand-name">Inbox sorter</div>
    <p class="sub">Runs on your computer. Nothing is written back to your mailbox.</p>
  </div>

  <nav class="tabs" aria-label="Pages">
    <a class="tab {{ 'active' if request.path == '/' else '' }}" href="{{ url_for('index') }}">Sorter</a>
    <a class="tab {{ 'active' if request.path == '/compare' else '' }}" href="{{ url_for('compare') }}">Compare</a>
  </nav>

  {% block sidebar %}{% endblock %}
</aside>

<main>
  {% block main %}{% endblock %}
</main>
</div>

<script src="{{ url_for('static', filename='common.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
