# Shared tool settings for the Python code in this repo.
# Each part keeps its own tests (see the Makefile); this file only configures ruff.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["email-sorter/frontend", "email-sorter/static"]

[tool.ruff.lint]
# Real mistakes only (syntax errors, undefined names, unused imports/variables).
# Style rules are left off so existing code is not rewritten just to satisfy a linter.
select = ["E9", "F"]
